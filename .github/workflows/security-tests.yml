name: Security Tests

on:
  push:
    branches: [main, security-hardening-2026-09]
  pull_request:
    branches: [main]

jobs:
  security-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Run complete test suite
        run: PYTHONPATH=. pytest -q tests

  postgres-security-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: picta_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d picta_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/picta_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Run PostgreSQL authorization integration test
        run: PYTHONPATH=. pytest -q tests/test_security.py -k postgres
